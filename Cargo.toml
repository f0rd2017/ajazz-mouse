[package]
name = "ajazz-mouse"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Configure the Ajazz AJ159 V2 wireless mouse on Linux (GTK4 + libadwaita)"
license = "MIT"
authors = ["yuto <f0rd2017@users.noreply.github.com>"]
repository = "https://github.com/f0rd2017/ajazz-mouse"
readme = "README.md"
keywords = ["ajazz", "mouse", "gtk4", "hidraw", "linux"]
categories = ["hardware-support"]

[dependencies]
adw = { package = "libadwaita", version = "0.9.2", features = ["v1_7"] }
async-channel = "2.5.0"
gtk = { package = "gtk4", version = "0.11.5", features = ["v4_14"] }
libc = "0.2.190"

[profile.dev.package."*"]
# GTK в отладочной сборке иначе заметно тормозит.
opt-level = 2

[profile.release]
lto = "thin"
strip = true

[package.metadata.deb]
section = "utils"
extended-description = """\
Native settings window for the Ajazz AJ159 V2 wireless mouse (2.4 GHz receiver 1d57:fa60): \
DPI levels and colors, polling rate, lift-off distance, button remapping, keyboard shortcuts, \
macros and sleep timers. Talks to the mouse directly over hidraw."""
maintainer-scripts = "packaging/debian/"
assets = [
    ["target/release/ajazz-mouse", "usr/bin/", "755"],
    ["data/io.github.f0rd2017.AjazzMouse.desktop", "usr/share/applications/", "644"],
    ["data/io.github.f0rd2017.AjazzMouse.metainfo.xml", "usr/share/metainfo/", "644"],
    ["data/icons/hicolor/128x128/apps/io.github.f0rd2017.AjazzMouse.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["data/icons/hicolor/256x256/apps/io.github.f0rd2017.AjazzMouse.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["data/icons/hicolor/512x512/apps/io.github.f0rd2017.AjazzMouse.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
    ["data/70-ajazz-mouse.rules", "usr/lib/udev/rules.d/", "644"],
]

[package.metadata.generate-rpm]
post_install_script = "udevadm control --reload-rules && udevadm trigger --subsystem-match=hidraw --action=change || :"
post_uninstall_script = "udevadm control --reload-rules || :"
assets = [
    { source = "target/release/ajazz-mouse", dest = "/usr/bin/ajazz-mouse", mode = "755" },
    { source = "data/io.github.f0rd2017.AjazzMouse.desktop", dest = "/usr/share/applications/io.github.f0rd2017.AjazzMouse.desktop", mode = "644" },
    { source = "data/io.github.f0rd2017.AjazzMouse.metainfo.xml", dest = "/usr/share/metainfo/io.github.f0rd2017.AjazzMouse.metainfo.xml", mode = "644" },
    { source = "data/icons/hicolor/128x128/apps/io.github.f0rd2017.AjazzMouse.png", dest = "/usr/share/icons/hicolor/128x128/apps/io.github.f0rd2017.AjazzMouse.png", mode = "644" },
    { source = "data/icons/hicolor/256x256/apps/io.github.f0rd2017.AjazzMouse.png", dest = "/usr/share/icons/hicolor/256x256/apps/io.github.f0rd2017.AjazzMouse.png", mode = "644" },
    { source = "data/icons/hicolor/512x512/apps/io.github.f0rd2017.AjazzMouse.png", dest = "/usr/share/icons/hicolor/512x512/apps/io.github.f0rd2017.AjazzMouse.png", mode = "644" },
    { source = "data/70-ajazz-mouse.rules", dest = "/usr/lib/udev/rules.d/70-ajazz-mouse.rules", mode = "644" },
    { source = "LICENSE", dest = "/usr/share/licenses/ajazz-mouse/LICENSE", mode = "644", doc = true },
]
